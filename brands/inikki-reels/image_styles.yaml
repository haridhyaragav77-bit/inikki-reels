# Image style presets for OpenAI prompts. No text in any image. Portrait 1024x1536.
painterly_warm:      # Suriya, VJS Theatre Accountant, Bhaskar
  look: "warm painterly illustration, visible brush texture, golden-hour light, rich teal and amber palette, cinematic composition, 1990s Tamil Nadu details"
  people: "inspired-by likeness through hairstyle, costume and setting; illustrated, not photoreal"
cinematic_real:      # stories: must read as a frame from a real Tamil film
  look: "photoreal frame from a Tamil feature film, shot on a cinema camera with an anamorphic lens, natural skin and fabric texture, shallow depth of field, light from real sources in the scene (tube lights, stage lights, street lamps, sunlight through windows), rich film colour grade with deep shadows and warm highlights, subtle film grain, vertical frame"
  people: "a fictional person who is not any real actor, shown in profile, three-quarter back view, silhouette or at a distance; never a recognisable real face"
arcane_painterly:    # Vikram Sethu
  look: "painterly animated-film look, textured brushwork, moody teal shadows, warm highlights, rain-soaked old theatre"
  people: "stylised character inspired by era and look"
diorama_moody:       # Guess the Movie: must read as a 3D render, like a film set in miniature
  look: "stylised 3D animated-film render of a miniature film set, like a high-end Blender or Unreal cinematic: clean modelled shapes, toy-like vehicles and props, soft global illumination, practical lamps and glowing lights, volumetric fog, shallow depth of field, rich saturated colour against a deep night sky, strong rim light on the main object"
  people: "no real faces: small stylised figures seen from behind or as silhouettes only"
  layering_hint: "one clear main object in the middle ground, a strong foreground element near the bottom edge, a simple far background, so the camera can travel through the scene"
