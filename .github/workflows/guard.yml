name: guard
# The Guard's check on every push and every pull request (AGENT.md 21). It holds no keys and can only read:
# safe to run even for a stranger's pull request. Stops anything key-shaped from sitting in the repository,
# and keeps the workflow safety rules (exact action versions, no typed input inside a command) from slipping.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-light.txt }
      - run: pip install -q -r requirements-light.txt
      - name: No keys in the repository
        run: python -m engine.guard scan
      - name: The Guard's own tests
        run: python -m tests.test_guard
