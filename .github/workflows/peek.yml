name: peek
# Workshop helper (build time only): contact sheets of the reference reels and folder lists from Drive,
# pushed to the throwaway 'peek' branch so the build session can look at them. Nothing is posted.
on:
  workflow_dispatch:
    inputs:
      what:
        description: "reference,music,memes,clips (or 'none')"
        default: reference,music,memes,clips
      frames:
        description: "full frames from a reference reel: <file>@t1,t2;<file>@t1"
        default: ""
      depth:
        description: "depth maps for pictures in image-library: name1.png,name2.png"
        default: ""

permissions:
  contents: write

jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/inikki
          key: render-tools-v1
      - run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q -r requirements.txt
      - run: python -m engine.peek --what "${{ inputs.what || 'reference,music,memes,clips' }}" --frames "${{ inputs.frames }}" --depth "${{ inputs.depth }}"
      - name: Push out/peek to the 'peek' branch (throwaway, deleted after the build)
        run: |
          cd out/peek
          git init -q
          git checkout -q -b peek
          git add -A
          git -c user.name=engine -c user.email=engine@users.noreply.github.com commit -q -m "peek $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" peek:peek
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
