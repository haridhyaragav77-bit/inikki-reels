name: daily
# Engine jobs on a clock (AGENT.md 4.3): health check, the brief before each thinking run, and the nightly
# stats + dashboard + clean-up. Times are IST; cron lines are UTC. Text results are committed to the repository.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Which job"
        type: choice
        options: [brief-plan, brief-refresh, brief-weekly, brief-monthly, health, nightly, clean-dry, watch-test, control, panel, drive-copy]
        default: brief-plan
  schedule:
    # GitHub's timer runs about 7 hours late here (found 14 Nov 2026), so the briefs and the nightly job are started on
    # time by the Claude clock tasks (AGENT.md 4.3, runs/README.md). The briefs have no line here on purpose: a late
    # brief would overwrite the right one just before a thinking run. These two stay as a late backstop.
    - cron: "31 22 * * *"     # 04:01 IST  health
    - cron: "10 18 * * *"     # 23:40 IST  nightly: stats, dashboard, clean-up

permissions:
  contents: write
  actions: write        # "control" starts Make for the reels Harish changed

concurrency:
  group: daily-${{ github.event.schedule || inputs.job || 'push' }}
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY || secrets.ELEVEN_LABS_API_KEY || secrets.ELEVENLABS_KEY || secrets.ELEVEN_API_KEY || secrets.XI_API_KEY }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Which job
        env:
          ASKED: ${{ inputs.job }}
        run: |
          case "${{ github.event.schedule }}" in
            "31 22 * * *") J=health;;
            "42 23 * * *") J=brief-plan;;
            "42 10 * * *") J=brief-refresh;;
            "42 16 * * 0") J=brief-weekly;;
            "12 17 1 * *") J=brief-monthly;;
            "10 18 * * *") J=nightly;;
            *) J="$ASKED";;
          esac
          echo "JOB=${J:-brief-plan}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-light.txt }
      - run: pip install -q -r requirements-light.txt
      - name: Nightly already done on time? (then GitHub's late timer has nothing to do here)
        if: env.JOB == 'nightly' && github.event_name == 'schedule'
        run: if python -m engine.status --recent nightly 10; then echo "Done on time by the clock; nothing to repeat."; echo "JOB=done" >> "$GITHUB_ENV"; fi
      - name: Health
        if: env.JOB == 'health'
        run: python -m engine.health
      - name: Brief
        if: startsWith(env.JOB, 'brief-')
        run: python -m engine.brief --run "${JOB#brief-}"
      - name: Nightly stats
        if: env.JOB == 'nightly'
        continue-on-error: true
        run: python -m engine.measure --nightly
      - name: Dashboard sheet
        if: env.JOB == 'nightly'
        continue-on-error: true
        run: python -m engine.dashboard
      - name: Clean-up
        if: env.JOB == 'nightly' || env.JOB == 'clean-dry'
        run: python -m engine.clean ${{ env.JOB == 'clean-dry' && '--dry' || '' }}
      - name: Control Room changes now (the inbox, word edits, new versions)
        if: env.JOB == 'control'
        run: python -m engine.edits
      - name: Control Room panel now
        if: env.JOB == 'panel'
        run: python -m engine.panel --print
      - name: One-time copy of the old Drive folder into the new one (move to a new Google account)
        if: env.JOB == 'drive-copy'
        run: python -m engine.drive copy-old
      - name: News feeds test
        if: env.JOB == 'watch-test'
        run: python -m engine.watch --test
      - name: Save the text results (brief, Control Room copy, metrics, packed plans)
        if: env.JOB != 'health' && env.JOB != 'clean-dry' && env.JOB != 'watch-test' && env.JOB != 'control' && env.JOB != 'panel' && env.JOB != 'drive-copy' && env.JOB != 'done'
        run: |
          git add -A data plans niches/*/series
          git diff --cached --quiet && exit 0
          python -m engine.guard staged      # the repository is public: private details are masked, a key stops the save
          git -c user.name="iNiKKi Engine" -c "user.email=41898283+github-actions[bot]@users.noreply.github.com" commit -q -m "engine: $JOB $(TZ=Asia/Kolkata date +%F)"
          for i in 1 2 3 4; do git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0; git pull -q --rebase origin "${GITHUB_REF_NAME}"; done
          exit 1
      - name: Status (always)
        if: always() && env.JOB != 'done'
        run: python -m engine.status "$JOB" "${{ job.status }}"
