name: post
# Engine job "Post" (AGENT.md 4.3, 12.1): runs a little before each of the 8 slots and posts the reel that is due.
# Checks the master switch right before posting. In rehearsal nothing is posted: the reel is marked "rehearsed".
# The same run takes in what Harish asked for in the Control Room (control/inbox), does the news watch and the 2-hour
# stats, and ends by rewriting the Control Room panel. Times are IST; the cron lines are in UTC.
on:
  workflow_dispatch:
    inputs:
      dry:
        description: "Posting test: upload one made reel to Instagram WITHOUT publishing it"
        type: boolean
        default: false
      now:
        description: "Post this made reel id right now (live phase only), e.g. 2026-11-13-watch-loved-jailer-2"
        default: ""
  schedule:
    - cron: "48 2 * * *"      # 08:18 IST → 08:30 slot
    - cron: "18 5 * * *"      # 10:48 IST → 11:00 flex slot
    - cron: "48 6 * * *"      # 12:18 IST → 12:30
    - cron: "48 9 * * *"      # 15:18 IST → 15:30
    - cron: "18 11 * * *"     # 16:48 IST → 17:00 flex
    - cron: "18 12 * * *"     # 17:48 IST → 18:00
    - cron: "18 14 * * *"     # 19:48 IST → 20:00
    - cron: "48 15 * * *"     # 21:18 IST → 21:30

permissions:
  contents: write       # word changes from the Control Room are saved to the plans (AGENT.md 8.5)
  actions: write        # ...and Make is started for them

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      BRAIN_FIRE_URL: ${{ secrets.BRAIN_FIRE_URL }}
      BRAIN_FIRE_TOKEN: ${{ secrets.BRAIN_FIRE_TOKEN }}
      DRY: ${{ inputs.dry && '--dry' || '' }}
      NOW: ${{ inputs.now || '' }}
      NO_WAIT: ${{ github.event_name != 'schedule' && '--no-wait' || '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-light.txt }
      - run: pip install -q -r requirements-light.txt
      - name: Control Room changes first (the inbox, word edits, new versions)
        continue-on-error: true
        run: python -m engine.edits
      - name: Post (or rehearse) the reel that is due
        run: python -m engine.post $DRY $NO_WAIT ${NOW:+--now $NOW --no-wait}
      - name: Status (always)
        if: always()
        run: python -m engine.status post "${{ job.status }}"
