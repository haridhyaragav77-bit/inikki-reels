name: render
# Makes reels from plan files (Engine job "Make", AGENT.md 4.3) and puts them in Drive for review.
# Nothing is posted. Used in Phase 2 for the three golden reels (CLAUDE.md rule 3: template changes re-render them).
on:
  workflow_dispatch:
    inputs:
      plans:
        description: "Plan files, separated by spaces"
        default: "plans/reference/vjs-second-tier.json plans/reference/kaithi-guess.json"
      to_drive:
        description: "Drive folder for the results"
        default: "rehearsal/phase2-golden"
      stand_ins:
        description: "Stand-in pictures and voice (no AI images made, nothing spent)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    name: Make reels from plans (nothing is posted)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY || secrets.ELEVEN_LABS_API_KEY || secrets.ELEVENLABS_KEY || secrets.ELEVEN_API_KEY || secrets.XI_API_KEY }}
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PLANS: ${{ inputs.plans || 'plans/reference/kaithi-guess.json' }}
      TO_DRIVE: ${{ inputs.to_drive || '' }}
      STAND_INS: ${{ (github.event_name == 'push' || inputs.stand_ins) && '--local' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22" }
      - name: Keep the depth model and the browser between runs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/inikki
            ~/.cache/ms-playwright
          key: render-tools-v2
      - name: Install ffmpeg, the Engine's libraries and the browser that draws the templates
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium >/dev/null
          cd engine && npm install --no-audit --no-fund --silent && npx playwright install chromium >/dev/null   # the approved looks
      - name: Check the plans against the rules
        run: python -m engine.plancheck --selftest $PLANS
      - name: Same plan, same picture (only on the test run after a template change)
        if: github.event_name == 'push'
        run: python -m engine.golden
      - name: Make the reels
        run: |
          if [ -n "$TO_DRIVE" ] && [ -z "$STAND_INS" ]; then python -m engine.render $PLANS --to-drive "$TO_DRIVE"; else python -m engine.render $PLANS $STAND_INS; fi
      - name: Review pictures to the throwaway 'review' branch (for the build session)
        if: always()
        run: |
          mkdir -p out/peek/render
          for d in out/reels/*/; do n=$(basename "$d"); mkdir -p "out/peek/render/$n"; cp "$d"sheet.jpg "$d"cover.jpg "$d"notes.md "$d"qc.json "out/peek/render/$n/" 2>/dev/null || true; done
          cp out/status/*.json out/peek/render/ 2>/dev/null || true
          python -m engine.guard preview --dir out/peek     # this branch is public: private details masked, a key stops the push
          B=review; [ -n "$STAND_INS" ] && B=review-test        # a stand-in test never overwrites the real review
          cd out/peek && git init -q && git checkout -q -b "$B" && git add -A
          git -c user.name=engine -c "user.email=41898283+github-actions[bot]@users.noreply.github.com" commit -q -m "render review $(date -u +%FT%TZ)" || exit 0
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$B:$B"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep the reels with this run
        if: always() && github.event.repository.private     # a public repository shows these files to everyone: Drive has them
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reels
          path: |
            out/reels/*/reel.mp4
            out/reels/*/cover.jpg
            out/reels/*/notes.md
            out/reels/*/qc.json
            out/reels/*/plan_resolved.json
          retention-days: 7
          if-no-files-found: ignore
