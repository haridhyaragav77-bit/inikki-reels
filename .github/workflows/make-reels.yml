# Make reels in the cloud and put them in Google Drive (AGENT.md 4.3). Never runs on Harish's laptop.
# By hand (Actions tab → Make reels → Run workflow): any plans in the approved looks, into any Drive folder.
# After a change to the approved looks (templates/, engine/render/): the golden test (CLAUDE.md rules 2 and 3).
# The reference set is checked for "same plan, same picture", made again and put in Drive rehearsal/golden-check/
# to compare with reference-reels/. The daily reels are made by the "make" workflow.
name: Make reels
on:
  workflow_dispatch:
    inputs:
      plans:
        description: "Plan files to render (pattern). Empty = the reference set in plans/reference/"
        required: false
        default: ""
      drive_folder:
        description: "Drive folder inside iNiKKi Reels (e.g. rehearsal). Empty = each plan's own folder"
        required: false
        default: ""
  # The golden test runs on the build branch, before the merge (CLAUDE.md rule 3). It is not repeated on main: the
  # merge carries the very files that were just tested, and each run of the whole set is about 17 runner minutes.
  push:
    branches-ignore: [main]
    paths: ["templates/**", "engine/render/**", "engine/drive.py", "engine/tools/pick_plans.py", ".github/workflows/make-reels.yml"]

concurrency:
  group: make-reels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
      GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      # The main voice only on a run started by hand; the automatic re-render after a change uses the free backup voice.
      ELEVENLABS_API_KEY: ${{ github.event_name == 'workflow_dispatch' && (secrets.ELEVENLABS_API_KEY || secrets.ELEVEN_LABS_API_KEY || secrets.ELEVENLABS_KEY || secrets.ELEVEN_API_KEY || secrets.XI_API_KEY) || '' }}
      FOLDER: ${{ github.event_name == 'push' && 'rehearsal/golden-check' || inputs.drive_folder }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }      # the golden test asks git which looks a push changed
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Tools (ffmpeg, the Engine's libraries, the browser that draws the looks)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt
          cd engine && npm install --no-audit --no-fund --silent && npx playwright install --with-deps chromium
      - name: Drive check
        id: drive
        run: |
          out=$(python -m engine.drive check | tail -1); echo "$out"
          echo "ready=$(echo "$out" | python -c 'import sys,json; print(str(json.load(sys.stdin).get("ready", False)).lower())')" >> "$GITHUB_OUTPUT"
      - name: Which plans
        run: |
          git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > changed.txt 2>/dev/null || rm -f changed.txt   # no list = the whole set
          python engine/tools/pick_plans.py "${{ inputs.plans }}" changed.txt > plans.txt
          echo "Plans to render:"; cat plans.txt
      - name: Music from Drive
        if: steps.drive.outputs.ready == 'true'
        run: python -m engine.drive sync-music $(cat plans.txt)
      - name: Same plan, same picture (golden test, after a change to the looks)
        if: steps.drive.outputs.ready == 'true' && github.event_name == 'push'
        run: python -m engine.golden $(cat plans.txt)
      - name: Render and check
        if: steps.drive.outputs.ready == 'true'
        run: |
          while read -r p; do [ -n "$p" ] && node engine/render/render.mjs "$p"; done < plans.txt
      - name: Put finished reels in Drive
        if: steps.drive.outputs.ready == 'true'
        run: |
          if [ ! -s plans.txt ]; then echo "nothing to upload"; exit 0; fi
          if [ -n "$FOLDER" ]; then python -m engine.drive upload-out "$FOLDER" --here $(cat plans.txt)
          else python -m engine.drive upload-out rehearsal $(cat plans.txt); fi
      - name: Keep a copy on GitHub for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reels
          path: engine/.work/out/*.mp4
          if-no-files-found: ignore
          retention-days: 7
