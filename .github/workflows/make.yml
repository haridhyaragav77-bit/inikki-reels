name: make
# Engine job "Make" (AGENT.md 4.3): plans → finished reels in Drive (rehearsal/<date>/ or finished/<date>/).
# Started by the Sync job when a thinking run saves plans, by a push of plans to main, or by the safety-net times below.
# A light first step checks whether anything new needs making, so the safety net costs about 1 runner minute.
# The check and the making are one job since 15 Nov 2026: two jobs were billed as two rounded-up minutes.
on:
  push:
    branches: [main]
    paths: ["plans/20*/**", "plans/bank/**", ".github/workflows/make.yml"]
  workflow_dispatch:
    inputs:
      date: { description: "Day to make (YYYY-MM-DD, IST). Empty = today", default: "" }
      only: { description: "Only these reel ids (comma-separated). Empty = all new ones", default: "" }
      retry: { description: "Make held or failed reels again", type: boolean, default: false }
  schedule:
    - cron: "12 1 * * *"      # 06:42 IST, after the Plan run
    - cron: "52 11 * * *"     # 17:22 IST, after the Refresh run

permissions:
  contents: read

concurrency:
  group: make
  cancel-in-progress: false

env:
  GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
  GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
  GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
  DATE: ${{ inputs.date || '' }}
  ONLY: ${{ inputs.only || '' }}
  RETRY: ${{ inputs.retry && '--retry' || '' }}

jobs:
  make:
    name: Make the reels (nothing is posted here)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY || secrets.ELEVEN_LABS_API_KEY || secrets.ELEVENLABS_KEY || secrets.ELEVEN_API_KEY || secrets.XI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      # One job, not two (each job is billed as at least a minute): the light check runs first, and the heavy tools
      # below are installed only when there is something to make.
      - name: Anything new to make?
        id: c
        run: |
          pip install -q -r requirements-light.txt
          python -m engine.make --check ${DATE:+--date $DATE} ${ONLY:+--only $ONLY} $RETRY
      - uses: actions/setup-node@v4
        if: steps.c.outputs.todo == 'true'
        with: { node-version: "22" }
      - name: Keep the depth model and the browser between runs
        if: steps.c.outputs.todo == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/inikki
            ~/.cache/ms-playwright
          key: render-tools-v2
      - name: Install ffmpeg, the Engine's libraries and the browser that draws the templates
        if: steps.c.outputs.todo == 'true'
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium >/dev/null
          cd engine && npm install --no-audit --no-fund --silent && npx playwright install chromium >/dev/null   # the approved looks
      - name: Make
        if: steps.c.outputs.todo == 'true'
        run: python -m engine.make ${DATE:+--date $DATE} ${ONLY:+--only $ONLY} $RETRY
      - name: Status (always, CLAUDE.md rule 6)
        if: always() && steps.c.outputs.todo == 'true'
        run: python -m engine.status make "${{ job.status }}"
