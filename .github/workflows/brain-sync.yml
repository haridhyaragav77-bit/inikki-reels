name: brain-sync
# Engine job "Sync" (AGENT.md 4.3, Block D): a thinking run pushes its work to a claude/brain-* branch.
# This copies only the files the Brain may write into main (anything else is refused and reported), puts the
# Brain's notes in Drive status/, starts Make for new plans, then deletes the branch.
on:
  push:
    branches: ["claude/brain-**"]
  workflow_dispatch:
    inputs:
      branch: { description: "The claude/brain-* branch to take", required: true }
      dry: { description: "Only show what would be taken", type: boolean, default: true }

permissions:
  contents: write
  actions: write

concurrency:
  group: brain-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
      CONTROL_ROOM_EMAIL: ${{ secrets.CONTROL_ROOM_EMAIL }}
      BRANCH: ${{ inputs.branch || github.ref_name }}
      DRY: ${{ inputs.dry && '--dry' || '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-light.txt }
      - run: pip install -q -r requirements-light.txt
      - name: Take the allowed files
        id: s
        run: python -m engine.sync --branch "$BRANCH" $DRY
      - name: Make the new plans
        if: steps.s.outputs.plans != '' && env.DRY == ''
        env:
          PLANS: ${{ steps.s.outputs.plans }}
        run: for d in $PLANS; do [ "$d" = bank ] && d=""; gh workflow run make.yml --ref main ${d:+-f date=$d}; done
      - name: Delete the Brain's branch
        if: env.DRY == ''
        run: git push -q origin --delete "$BRANCH" || true
      - name: Status (always)
        if: always()
        run: python -m engine.status sync "${{ job.status }}"
