name: fetch
# Cloud first (Harish, 25 Nov; AGENT.md 16.6): every night the cloud tries the laptop run's list itself with yt-dlp
# (trailers, the film-bank top-up, shorts to study, trending songs). Signed in to YouTube with the secret YOUTUBE_COOKIES
# (a spare account's cookies.txt). A refusal stops it at once and the list waits for the laptop run, as before.
# What it gets goes into Drive from-laptop/, is sorted, and the trailer, study and music pick-ups start at once.
on:
  workflow_dispatch:
  schedule:
    - cron: "35 17 * * *"     # 23:05 IST, before the nightly list is written (23:40)

permissions:
  contents: read
  actions: write        # starts the trailer, study and music pick-ups when something was fetched

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
      CONTROL_ROOM_EMAIL: ${{ secrets.CONTROL_ROOM_EMAIL }}
      YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-light.txt }
      - run: pip install -q -r requirements-light.txt -U "yt-dlp[default]" imageio-ffmpeg
      - name: Try the laptop list from the cloud
        run: python -m engine.autofetch
      - name: Status (always)
        if: always()
        run: python -m engine.status fetch "${{ job.status }}"
