name: study
# Channel study (AGENT.md 10.3): read the YouTube channels we study (free public feed), then turn the Tamil speech of the
# shorts worth studying into text with Whisper, a free open-source program that runs here. No AI service, no cost.
# The full text goes to Drive study/; the repository gets only the study cards (data/study/). Nothing is worked around:
# a short YouTube will not give to this computer goes on the laptop list (Drive requests/study_to_get.md).
on:
  workflow_dispatch:
  schedule:
    - cron: "47 20 * * *"     # 02:17 IST, a quiet hour; a late start does no harm (the Weekly run reads the cards on Sunday)

permissions:
  contents: write

concurrency:
  group: study
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
      CONTROL_ROOM_EMAIL: ${{ secrets.CONTROL_ROOM_EMAIL }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-study.txt }
      - run: pip install -q -r requirements-light.txt -r requirements-study.txt
      - name: Whisper model (kept between runs, so it is downloaded once)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ hashFiles('config/engine.yaml') }}
          restore-keys: whisper-
      - name: Channel watch and study
        run: python -m engine.study
      - name: Save the study cards and the channel table
        run: |
          git add -A data/study
          git diff --cached --quiet && exit 0
          python -m engine.guard staged      # the repository is public: private details are masked, a key stops the save
          git -c user.name="iNiKKi Engine" -c "user.email=41898283+github-actions[bot]@users.noreply.github.com" commit -q -m "engine: study $(TZ=Asia/Kolkata date +%F)"
          for i in 1 2 3 4; do git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0; git pull -q --rebase origin "${GITHUB_REF_NAME}"; done
          exit 1
      - name: Status (always)
        if: always()
        run: python -m engine.status study "${{ job.status }}"
