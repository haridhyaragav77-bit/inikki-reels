name: music
# Tags every track in the Drive music folder (and anything dropped into music/inbox) by tempo, energy and mood,
# and writes music/index.json. Reels then pick tracks by mood (AGENT.md 5.4). Free; nothing is posted.
on:
  workflow_dispatch:
    inputs:
      all:
        description: "Tag every track again (not only new ones)"
        type: boolean
        default: false
  schedule:
    - cron: "17 21 * * 0"          # Sundays 02:47 IST: picks up new tracks from music/inbox

permissions:
  contents: write

concurrency:
  group: music
  cancel-in-progress: false

jobs:
  music:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
      CONTROL_ROOM_EMAIL: ${{ secrets.CONTROL_ROOM_EMAIL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q -r requirements.txt
      - name: Sort what the laptop run dropped into Drive from-laptop/ (songs go to music/inbox; AGENT.md 16.6)
        continue-on-error: true
        run: python -m engine.laptop --sort
      - run: python -m engine.music_index $ALL
        env:
          ALL: ${{ inputs.all && '--all' || '' }}
      - name: Save the trending songs list (data/music/trending.json, AGENT.md 5.4)
        run: |
          git add -A data/music
          git diff --cached --quiet && exit 0
          python -m engine.guard staged      # the repository is public: private details are masked, a key stops the save
          git -c user.name="iNiKKi Engine" -c "user.email=41898283+github-actions[bot]@users.noreply.github.com" commit -q -m "engine: music $(TZ=Asia/Kolkata date +%F)"
          for i in 1 2 3 4; do git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0; git pull -q --rebase origin "${GITHUB_REF_NAME}"; done
          exit 1
      - name: Summary to the throwaway 'review-music' branch (for the build session)
        if: always()
        run: |
          [ -d out/peek ] || exit 0
          python -m engine.guard preview --dir out/peek     # this branch is public: private details masked, a key stops the push
          cd out/peek && git init -q && git checkout -q -b review-music && git add -A
          git -c user.name=engine -c "user.email=41898283+github-actions[bot]@users.noreply.github.com" commit -q -m "music index $(date -u +%FT%TZ)" || exit 0
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" review-music:review-music
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
