# Engine settings (code reads these; nothing brand- or niche-specific lives here)
drive:
  folders: [control, control/inbox, status, reference-reels, meme-bank, music, music/inbox, clip-library, image-library, work, finished, rehearsal, manual-post, inspiration, requests, study-audio, study, from-laptop]
  cap_gb: 30                 # the agent's whole storage (Harish, 22 Nov: the new Google account's 30 GB)
  music_folder_aliases: ["music", "background music", "background music (1)"]
  never_auto_delete: [reference-reels, meme-bank, music, control]
  retention:                 # AGENT.md 14.3, 14.4 (the nightly Clean job)
    finished_days: 60          # Harish, 22 Nov: the Drive is 30 GB now (AGENT.md 14.4)
    finished_days_tight: 30
    rehearsal_days: 14
    work_days: 3
    status_days: 30
    clip_library_gb: 12
    image_library_gb: 4
    warn_gb: 25
    tight_gb: 28
    keep_top_share: 0.10
    study_text_days: 90      # full text of studied shorts (Drive study/); the cards in the repository stay
  dashboard_sheet_name: "iNiKKi Dashboard"
  dashboard_tabs: [Home, Metrics, Series, Reels, Lab, Changes, Costs]
runner:
  minutes_month: 2000         # GitHub's free minutes for a private repository (a public one has no limit: the health job sees which it is)
  tight_share: 0.85           # above this: no reserves, no bank reels, no extra news checks
  save_forecast: 1.0          # the month is heading past the limit at today's pace: the same savings start early
  last_share: 0.95            # above this: at most `last_reels_day` new reels a day, so posting never stops before the 1st
  last_reels_day: 3
  usd_per_minute_over: 0.008  # what GitHub charges per extra minute, only if a spending limit is set (default: none, jobs stop)
# The Guard (AGENT.md 21, engine/guard.py): what keeps a public repository safe. The daily health job runs the look-around.
guard:
  trusted_actors: ["dependabot[bot]", "github-pages[bot]"]   # GitHub names (besides the owner and GitHub's own clock) allowed to start jobs; dependabot = GitHub's own package checker
  extra_people: []            # Google accounts (besides the folder's owner and the Engine) allowed in the Drive folder
  drive_folders: [control, control/inbox, status]   # checked every day for "anyone with the link" (the main folder always is)
  preview_branches: [peek, review, "review-*"]      # build previews: deleted a day after their last change
  preview_hours: 24
  posts_checked: 30           # newest posts on the page compared with what the Engine posted
  voice_margin: 6000          # voice credits used outside the Engine in a day before it is mentioned
  mask_in: ["data/*"]         # files the Engine writes and commits: keys and emails are masked before saving
  scan_skip: ["tests/test_guard.py"]                # holds made-up keys for the Guard's own test
# Posting with fewer runner minutes (AGENT.md 15.3). Nothing here changes what is posted or when.
post:
  early_upload: true          # a made reel is uploaded to Instagram at once, unpublished; its slot's run only publishes it
  early_upload_max_hours: 20  # Instagram keeps an unpublished upload for 24 hours; older ones are uploaded again at the slot
  watch_gap_minutes: 50       # a Post run this soon after the last news watch does not read the same feeds again
# YouTube Shorts (AGENT.md 5.15): each reel Instagram posted also goes to YouTube in the same Post run. Free.
youtube:
  enabled: true               # needs the secret YOUTUBE_OAUTH_REFRESH_TOKEN; without it nothing is tried
  privacy: private            # private until Google's free audit of the app is passed, then public
  series: all                 # all, or a list of series ids
  max_per_day: 8
  tries: 2                    # a failed upload is tried again by the next Post run, at most this many times
  category_id: "1"            # Film & Animation
  made_for_kids: false
manual:                       # Control Room › Manual work (AGENT.md 16.6, engine/manual.py)
  urgent_hours: 24            # a job is urgent this many hours before it is due
  warn_days: 2                # an alert this many days before a job turns urgent
  make_hours: 3               # a trailer for a planned reel is due this long before its slot
  news_hours: 24              # a new trailer reported in the news: due within a day
  other_days: 3               # a wanted trailer with no reel date yet
  topup_days: 14              # the film-bank library top-up
  done_hold_hours: 48         # after Done, those films wait for the Engine to pick them up before they can be asked again
  laptop_every_days: 15       # the laptop run (Harish, 22 Nov): one command every 15-20 days for every download
  laptop_late_days: 20        # due this many days after the last run (warning 2 days before urgent, urgent the last day)
  laptop_first_days: 3        # the first run of the one-command helper is due within this many days
laptop:                       # the laptop run's list (engine/laptop.py, AGENT.md 16.6)
  songs_max: 15               # trending songs fetched per run
# Channel study (AGENT.md 10.3): free. The channel list is the niche's `competitors` with study: true.
study:
  enabled: true
  beat: 1.5                   # a short beating its channel's median views by this much is studied
  per_day: 6                  # at most this many shorts turned into text a day
  model: medium               # Whisper size: small (fast) | medium | large-v3 (best, slow); runs on GitHub's computer
  language: ta
  min_age_hours: 48           # a short's views settle for 2 days before it is compared
  card_beats: 8               # beats kept on a study card
  card_words: 6               # first words of each beat on the card (the full text stays in Drive)
# Jobs the Claude clock tasks start on time (AGENT.md 4.3; times are IST: "05:12" daily, "sun 22:12", "1 22:42" on that
# day of the month). Post is started at every slot of config/agent.yaml. The Control Room's "next runs" list reads this.
clock:
  - { what: "Brief for the Plan run", kind: daily, at: "05:12" }
  - { what: "Brief for the Refresh run", kind: daily, at: "16:12" }
  - { what: "Brief for the Weekly run", kind: daily, at: "sun 22:12" }
  - { what: "Brief for the Monthly run", kind: daily, at: "1 22:42" }
  - { what: "Nightly: numbers, dashboard, clean-up", kind: daily, at: "23:40" }
# What each clock line of the Engine's jobs does, for the Control Room's "next runs" list (engine/panel.py).
# The times themselves are read from .github/workflows/*.yml; a line missing here shows under its job's name.
schedule_labels:
  post: "Post"
  make: "Make reels"
  trailers: "Fetch trailers"
  music: "Music index"
  study: "Channel study (sources, speech to text, source scout)"
  daily:
    "31 22 * * *": "Health check"
    "42 23 * * *": "Brief for the Plan run"
    "42 10 * * *": "Brief for the Refresh run"
    "42 16 * * 0": "Brief for the Weekly run"
    "12 17 1 * *": "Brief for the Monthly run"
    "10 18 * * *": "Nightly: numbers, dashboard, clean-up"

openai:
  image_models: [gpt-image-1-mini, gpt-image-1]     # first that works is used
  image_size: "1024x1536"                           # portrait, upscaled to 1080x1920 by code
  image_quality: medium
  smoke_quality: low
  # Prices per image in US dollars for 1024x1536 (OpenAI pricing page, re-checked by the Health job).
  price_usd_per_image:
    gpt-image-1-mini: { low: 0.006, medium: 0.015, high: 0.05 }
    gpt-image-1:      { low: 0.016, medium: 0.063, high: 0.25 }
  # Token prices (USD per 1M tokens) used when the API reports usage
  price_usd_per_m_tokens:
    gpt-image-1-mini: { text_in: 2.0, image_in: 2.5, image_out: 8.0 }
    gpt-image-1:      { text_in: 5.0, image_in: 10.0, image_out: 40.0 }
  usd_to_inr: 88.0
  # Added to every image request, by template, so the words never sit on a face or on the main object
  compose:
    cinematic: "Composition: the main subject and any face sit in the upper half of the frame; the lower third is darker and simpler, with no important detail"
    diorama: "Composition: the main object sits in the middle band of the frame; the top third is darker and simpler, with no important detail"

instagram:
  base: "https://graph.instagram.com"
  api_versions: ["v23.0", "v22.0", "v21.0"]        # first that works is used
  reel_metrics_wanted: [views, reach, likes, comments, shares, saved, reposts, total_interactions, ig_reels_avg_watch_time, ig_reels_video_view_total_time, reels_skip_rate, ig_reels_skip_rate, skip_rate]

voice:
  # Main voice and backup (AGENT.md 4.4). Harish's live choice is config/agent.yaml `voice` (Control Room → Setup).
  provider: elevenlabs
  backup: microsoft
  # Microsoft (free, the backup), through tools/voice_tool.py
  tool: tools/voice_tool.py
  voice: ta-IN-ValluvarNeural
  rate: "+35%"
  pitch: "-2Hz"
  microsoft_prefixes: ["ta-", "en-", "hi-"]          # a voice name that starts like this is a Microsoft voice
  smoke_text: "வணக்கம். இது iNiKKi Reels குரல் சோதனை."
  elevenlabs:
    base: "https://api.elevenlabs.io"
    key_names: [ELEVENLABS_API_KEY, ELEVEN_LABS_API_KEY, ELEVENLABS_KEY, ELEVEN_API_KEY, XI_API_KEY]   # the first one set is used
    voice: ashwin                                    # the default; a series or a plan may name another from this list
    voices:                                          # short name → ElevenLabs voice (shown as a pick-list in the Control Room)
      ashwin:    { id: OP382u5y4MvFmE1mReFV, label: "Ashwin · casual Tamil creator (young, energetic)" }
      bharadwaj: { id: msoKpYddp2Iy2G7DJ3dc, label: "Bharadwaj · deep suspense storyteller" }
      prashant:  { id: yIFUVClxedWzoMYhk15k, label: "Prashant · calm, friendly, Chennai accent" }
    models: [eleven_multilingual_v2, eleven_v3]      # first that works is used (best quality first)
    economy_models: [eleven_flash_v2_5, eleven_multilingual_v2]   # "economy" quality: about half the credits per line
    context_models: [eleven_multilingual_v2, eleven_flash_v2_5, eleven_turbo_v2_5]   # these read the lines before and after
    language_code: ta
    language_code_models: [eleven_flash_v2_5, eleven_turbo_v2_5, eleven_v3]
    output_format: mp3_44100_128
    settings: { stability: 0.45, similarity_boost: 0.8, style: 0.2, use_speaker_boost: true, speed: 1.1 }
    one_take: true                                   # the whole reel in one read, cut between lines (smooth, no stitching)
    reserve_credits: 1000                            # below this the backup voice speaks until the credits renew

clips:
  max_height: 720
  smoke_query: "ytsearch1:Kaithi official trailer Karthi Lokesh Kanagaraj"
  smoke_seconds: 8
  contact_sheet: { cols: 5, rows: 6, width: 1800 }

depth:
  # A small free depth model (Depth Anything V2 small, ONNX). It runs on the runner's CPU: no key, no cost.
  # If it cannot be fetched, pictures still move, with a simpler split (fail soft).
  file: depth_anything_v2_small.onnx
  model_urls:
    - "https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/main/onnx/model.onnx"
    - "https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/main/onnx/model_quantized.onnx"
  threads: 2

music:
  trending:                   # Harish, 22 Nov (AGENT.md 5.4): this month's trending songs from the laptop run
    days: 45                  # a song stays on the trending list this long after it arrives
    voiced: false             # music-only reels only: if Instagram mutes a matched song, a voiced reel would lose its voice too
    on_match: post            # Instagram's copyright check matches a trending song: post anyway (organic only, never boosted)
  # Words in a track's file name that suggest a mood. The weekly review replaces this guess with results
  # (tracks are scored by the watch-through of the reels that used them, AGENT.md 5.4).
  mood_words:
    tension_pulse: [chase, anxious, hunt, mission, danger, escape, attack, investigates, investigation, suspense, tension, thriller]
    upbeat_percussive: [intro, entry, rap, beat, dance, kuthu, celebration, title, swag]
    emotional_build: [emotion, emotional, sad, amma, promise, heart, memories, farewell, piano, father, mother]
    suspense_ticks: [investigation, investigates, mystery, secret, missing, search, suspense, pact]
    stinger: [intro, title, attack, hunt]
    soft_warm: [love, romance, flute, piano, lullaby, melody]
    confident_mid: [theme, hero, walk, intro, king]
  # Words in a file name that say a track does NOT fit a mood (a love theme is not suspense, a fight is not soft)
  avoid_words:
    tension_pulse: [love, romance, romantic, propose, proposes, married, marriage, wedding, kadhal, baby, lullaby, comedy]
    suspense_ticks: [love, romance, romantic, propose, proposes, married, marriage, wedding, kadhal, baby, lullaby, comedy, entry, mass]
    stinger: [love, romance, lullaby, sad, farewell]
    emotional_build: [fight, chase, attack, shoot, riots, entry, rap, phonk, comedy]
    soft_warm: [fight, chase, attack, shoot, riots, entry, rap, phonk, villain]
    upbeat_percussive: [sad, emotional, death, cry, farewell, lullaby]
    confident_mid: [sad, cry, lullaby, farewell]

images:
  # Where a picture is looked for, cheapest first (AGENT.md 5.11). An AI image is made only when these find nothing.
  ladder: [library, trailer, pexels, pixabay, openverse]
