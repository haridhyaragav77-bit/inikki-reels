/* A status file from before 14 Nov has no framework or series values yet: use the copy built into this page from the same files. */
function fill(p) {
  if (!p.framework && EXAMPLE.framework) { p.framework = JSON.parse(JSON.stringify(EXAMPLE.framework));
    (p.framework.switches || []).forEach(x => { if (x.key === "approval" && p.approval) x.value = p.approval; if (x.key === "away_mode") x.value = !!p.away; }); }
  (p.series || []).forEach(s => { const e = (EXAMPLE.series || []).find(x => x.id === s.id); if (e && !s.values) { s.values = e.values; s.has_reference = e.has_reference; s.look = s.look || e.look; } });
  return p;
}
function onData(result) {
  try { P = fill(unpack(result)); live = true; problem = ""; } catch (e) { problem = e.message; }
  asked = asked.filter(a => a.at > Date.parse(P.updated_iso || 0) - 60000 && Date.now() - a.at < 36 * 3600e3); save("asked", asked);
  render();
}
function onError(err) {
  const c = err && err.code;
  problem = c === "needs_reauth" || c === "server_not_connected" ? "Google Drive is not connected. In Claude: Settings → Connectors → Google Drive, then press Refresh."
    : c === "not_granted" ? "This page needs your permission to read Google Drive. Press Refresh and choose Allow."
    : "The status file could not be read just now (" + ((err && err.message) || "unknown reason") + "). Press Refresh to try again.";
  render();
}
function refresh() {
  if (!mcp) return toast("Showing example data. Open this page in Claude with Google Drive connected.");
  $("#updated").textContent = "Reading…";
  mcp.callTool(CFG.server, "read_file_content", { fileId: CFG.panel }, { cache: { refresh: true } }).then(onData, onError);
}
let watching = false;
function poll() { if (poll.on) return; poll.on = true; refresh(); setInterval(() => { if (!document.hidden) refresh(); }, 180000); }
function connect() {
  const c = window.claude;
  if (!c || !c.use) { problem = "Showing example data. Open this page in Claude to see your own."; return render(); }
  c.use("mcp").then(m => {
    if (!m) { problem = "Showing example data. Live data needs this page opened in Claude with Google Drive connected."; return render(); }
    mcp = m;
    try { mcp.watchTool(CFG.server, "read_file_content", { fileId: CFG.panel }, ev => {
        if (ev.type === "data") { watching = true; return onData(ev.result); }
        if (!watching && !live) return poll();           // this viewer cannot keep a watch: read it ourselves instead
        onError(ev.error); }, { refetchInterval: 180000 }); }
    catch (e) { poll(); }
  });
}

/* ---------- sending one small note to the inbox ---------- */
function pickup() { const s = (P.schedule || []).find(x => x.kind !== "think" && Date.parse(x.at) > Date.now()); return s ? `${hm(s.at)} (in ${span(Date.parse(s.at) - Date.now())})` : "its next job"; }
function send(action, label, key) {
  if (!mcp) { toast("Example mode: nothing was sent. Open this page in Claude with Google Drive connected."); return Promise.resolve(false); }
  const d = new Date(), ts = d.toISOString().replace(/[-:T]/g, "").slice(0, 14);
  return mcp.callTool(CFG.server, "create_file", { title: `${ts}-${action.do}.json`, parentId: CFG.inbox, contentMimeType: "text/plain",
    disableConversionToGoogleType: true, textContent: JSON.stringify(action) }).then(() => {
      asked.push({ at: Date.now(), label, key: key || "" }); save("asked", asked);
      toast(`Sent: ${label}. The Engine picks it up at ${pickup()}.`); render(); return true;
    }, err => { toast("Not sent: " + ((err && err.message) || "Google Drive refused") + "."); return false; });
}
const askedFor = key => asked.filter(a => a.key === key).map(a => a.label);

      if (m[1].length === 1) h += `<h2 style="font-size:28px">${inline(m[2])}</h2>`;
      else if (m[1].length === 2) { const id = "g" + toc.length; toc.push([id, m[2]]); h += `<h2 id="${id}">${inline(m[2])}</h2>`; }
      else h += `<h3>${inline(m[2])}</h3>`;
      i++; continue;
    }
    if (l.trim().startsWith("|") && L[i + 1] && /^\s*\|[\s:|-]+\|\s*$/.test(L[i + 1])) {
      const hd = cells(l); i += 2; let rows = "";
      while (i < L.length && L[i].trim().startsWith("|")) { rows += "<tr>" + cells(L[i]).map(c => `<td>${inline(c)}</td>`).join("") + "</tr>"; i++; }
      h += `<div class="tablewrap"><table><tr>${hd.map(c => `<th>${inline(c)}</th>`).join("")}</tr>${rows}</table></div>`; continue;
    }
    if (l.startsWith(">")) { let t = []; while (i < L.length && L[i].startsWith(">")) { t.push(L[i].replace(/^>\s?/, "")); i++; }
      const text = t.join(" "); h += `<blockquote><p>${inline(text)}</p><div><button type="button" data-copy="${esc(text)}">Copy this prompt</button></div></blockquote>`; continue; }
    if (/^\s*(-|\d+\.)\s+/.test(l)) { const ord = /^\s*\d+\./.test(l); let items = "";
      while (i < L.length && (/^\s*(-|\d+\.)\s+/.test(L[i]) || (/^\s{2,}\S/.test(L[i]) && L[i].trim()))) {
        if (/^\s*(-|\d+\.)\s+/.test(L[i])) items += `<li>${inline(L[i].replace(/^\s*(-|\d+\.)\s+/, ""))}`; else items += " " + inline(L[i].trim());
        i++; }
      h += ord ? `<ol>${items}</ol>` : `<ul>${items}</ul>`; continue; }
    let p = [l]; i++;
    while (i < L.length && L[i].trim() && !/^(#|\||>|\s*(-|\d+\.)\s)/.test(L[i])) { p.push(L[i]); i++; }
    h += `<p>${inline(p.join(" "))}</p>`;
  }
  return `<div class="toc">${toc.map(([id, t]) => `<button type="button" class="quiet" data-jump="${id}">${esc(t.replace(/^\d+\.\s*/, ""))}</button>`).join("")}</div><div class="guide">${h}</div>`;
}
