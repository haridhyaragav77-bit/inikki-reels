<title>iNiKKi Control Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: a cinema showtimes board. One sticky marquee (switch, countdown to the next show), then tabs; each reel is a showtime row. */
:root{
  --bg:#0A0F18; --panel:#121829; --panel2:#1A2138; --line:#2A3354; --fg:#F4F6FB; --muted:#A9B2C8;
  --gold:#F8C028; --on-gold:#0A0F18; --teal:#78E0D0; --sky:#7CC4FA; --red:#F0676B; --amber:#F0A040; --green:#5AD19A;
  --display:"Anton","Arial Narrow",Impact,sans-serif; --text:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#EEF1F7; --panel:#FFFFFF; --panel2:#E4E9F3; --line:#C5CEE0; --fg:#0E1424; --muted:#55607A;
  --gold:#A66F00; --on-gold:#FFFFFF; --teal:#0B7F70; --sky:#1F6FB5; --red:#C4302B; --amber:#A85F00; --green:#17794B; color-scheme:light } }
:root[data-theme="light"]{
  --bg:#EEF1F7; --panel:#FFFFFF; --panel2:#E4E9F3; --line:#C5CEE0; --fg:#0E1424; --muted:#55607A;
  --gold:#A66F00; --on-gold:#FFFFFF; --teal:#0B7F70; --sky:#1F6FB5; --red:#C4302B; --amber:#A85F00; --green:#17794B; color-scheme:light }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--text);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.marquee{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.marquee .wrap{padding-block:12px 0;display:flex;flex-direction:column;gap:10px}
.brandrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:26px;letter-spacing:.02em;line-height:1;text-transform:uppercase}
.brand b{color:var(--gold);font-weight:400}
.stamp{color:var(--muted);font-size:12.5px;margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.showrow{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}
.next{flex:1 1 260px;min-width:0;display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:6px dotted var(--gold);border-radius:4px;padding:8px 12px}
.next .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.next .what{font-weight:600;overflow-wrap:anywhere}
.next .count{font-family:var(--display);font-size:30px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums;margin-left:auto;white-space:nowrap}
.switch{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex:0 0 auto}
.switch button{border:0;border-radius:0;background:var(--panel);padding:8px 12px;min-width:74px}
.switch button+button{border-left:1px solid var(--line)}
.switch button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);font-weight:700}
.switch button[data-mode="sleep"][aria-pressed="true"]{background:var(--red);color:var(--bg)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:9px 12px;color:var(--muted);text-decoration:none;font-weight:600;font-size:13.5px;letter-spacing:.04em;text-transform:uppercase;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--gold)}
main .wrap{padding-block:18px 60px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.03em;text-transform:uppercase;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0}
.sub{color:var(--muted);font-size:13px}
.banner{border:1px solid var(--line);border-left:4px solid var(--amber);background:var(--panel);padding:10px 12px;border-radius:4px;font-size:14px}
.banner.bad{border-left-color:var(--red)} .banner.eg{border-left-color:var(--sky)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;background:var(--panel);overflow:hidden}
.reel{display:grid;grid-template-columns:74px minmax(0,1fr);gap:4px 14px;padding:14px;border-top:1px solid var(--line)}
.reel:first-child{border-top:0}
.time{font-family:var(--display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.time small{display:block;font-family:var(--text);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:5px}
.hook{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px;margin-top:3px}
.pill{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.ready{color:var(--teal)} .pill.posted{color:var(--green)} .pill.held,.pill.failed{color:var(--red)}
.pill.planned,.pill.rendering{color:var(--amber)} .pill.skipped,.pill.rehearsed{color:var(--muted)} .pill.asked{color:var(--sky);border-style:dashed}
.why{font-size:13px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button,a.btn{font:inherit;font-size:13.5px;font-weight:600;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:7px 12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button:hover,a.btn:hover{border-color:var(--muted)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
button.go{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
button.warn{color:var(--red)} button.quiet{background:transparent}
button:disabled{opacity:.5;cursor:default}
.drawer{grid-column:1/-1;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:12px;margin-top:10px;display:flex;flex-direction:column;gap:10px}
label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input[type=text],textarea{font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%;text-transform:none;letter-spacing:0;font-weight:400}
textarea{min-height:92px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border-radius:99px;padding:5px 11px;font-weight:500}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.rows{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:baseline;padding:9px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0}
.row .t{font-variant-numeric:tabular-nums;font-weight:700;min-width:88px}
.row .in{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.row.think .w{color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.big{font-family:var(--display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)} .bar i.hot{background:var(--amber)} .bar i.over{background:var(--red)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 12px;border-top:1px solid var(--line);vertical-align:top}
tr:first-child th{border-top:0} th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--muted)}
.dot.green{background:var(--green)} .dot.amber{background:var(--amber)} .dot.red{background:var(--red)}
.rule{display:flex;gap:8px;align-items:flex-start;font-size:14px;border-left:3px solid var(--gold);padding-left:10px}
.rule span{flex:1;min-width:0;overflow-wrap:anywhere}
.inline{display:flex;gap:8px;flex-wrap:wrap} .inline input{flex:1 1 220px;min-width:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:600;font-size:14px;max-width:min(92vw,560px);z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.guide{max-width:68ch} .guide h2{margin-top:26px} .guide h3{margin-top:14px;font-size:16px}
.guide p,.guide li{font-size:15px} .guide ul,.guide ol{padding-left:22px;margin:6px 0}
.guide code{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:0 5px;font-size:13px;overflow-wrap:anywhere}
.guide blockquote{margin:8px 0;border:1px solid var(--line);border-left:4px solid var(--gold);background:var(--panel);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.guide blockquote p{margin:0} .guide .tablewrap{margin:8px 0}
.toc{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:520px){ .reel{grid-template-columns:58px minmax(0,1fr)} .time{font-size:22px} .next .count{font-size:24px} .brand{font-size:22px} }
@media (prefers-reduced-motion:no-preference){ button,a.btn{transition:border-color .12s} }
</style>

<header class="marquee"><div class="wrap">
  <div class="brandrow">
    <div class="brand">i<b>N</b>i<b>KK</b>i Control Room</div>
    <div class="stamp"><span id="phase"></span><span id="updated">Loading…</span><button id="refresh" class="quiet" type="button">Refresh</button></div>
  </div>
  <div class="showrow">
    <div class="next"><div style="min-width:0"><div class="lbl" id="nextlbl">Next run</div><div class="what" id="nextwhat">—</div></div><div class="count" id="count">--:--:--</div></div>
    <div class="switch" role="group" aria-label="Master switch">
      <button type="button" data-mode="run" aria-pressed="false">Run</button>
      <button type="button" data-mode="hold_posts" aria-pressed="false">Hold posts</button>
      <button type="button" data-mode="sleep" aria-pressed="false">Sleep</button>
    </div>
  </div>
  <nav class="tabs" aria-label="Sections">
    <a href="#today">Today</a><a href="#next">Next</a><a href="#numbers">Numbers</a><a href="#series">Series</a><a href="#money">Money</a><a href="#setup">Setup</a><a href="#guide">Guide</a>
  </nav>
</div></header>
<main><div class="wrap" id="view"></div></main>
<div id="toast" hidden role="status"></div>

<script>
const CFG = { server: "Google Drive", panel: "1QTsgL08RAYpcVozoWxw6wExtzbQv0bTy", inbox: "1Y2XGA7u4D_8hH04Nm2gOywYXVgpeZmE1" };
const GUIDE = __GUIDE_JSON__;
const IST = { timeZone: "Asia/Kolkata" };
const BAD = ["Hook slow", "Unclear title", "Too wordy", "Too static", "Too long", "Visuals weak", "Music doesn't fit", "Silent start", "Not worth it", "Voice off", "Spoiler", "Fact wrong"];
const GOOD = ["Great hook", "Great insight", "Great style"];
const FIELD = { "screens.0.lines": "Title lines (put / between lines)", "screens.0.headline": "Headline", "screens.0.headline2": "Second headline", "screens.0.line": "Opening line",
  "screens.0.kicker": "Small line above the title", "screens.0.film": "Film name on the title screen", "screens.0.type": "Label under the film name", "screens.0.what": "What happened (title screen)",
  "screens.0.voice": "Opening voice line (Tamil)", "screens.0.voice_tg": "Opening voice line (Tanglish subtitle)", "screens.0.caption": "Title screen caption", "screens.0.caption_tamil": "Title screen caption (Tamil)",
  "screens.0.tamil": "Tamil line", "screens.0.poster_tag": "Poster tag", "package.caption": "Caption (blank line between paragraphs)", "package.hashtags": "Hashtags", "package.cover": "Cover title", "package.first_comment": "First comment" };

/* Example data, shown only until the live panel loads or when Google Drive is not connected. Not your numbers. */
function sample() {
  const now = Date.now(), at = h => new Date(now + h * 3600e3).toISOString();
  return { example: true, updated: "example", updated_iso: new Date(now).toISOString(), switch: "run", phase: "live", approval: "autopilot",
    today: { date: "example day", reels: [
      { n: 1, id: "example-update-01", series: "movie-updates", state: "posted", slot: "08:30", hook: "EXAMPLE · RELEASE DATE OUT", posted: "https://www.instagram.com/" },
      { n: 2, id: "example-breakdown-01", series: "film-breakdown", state: "ready", slot: "12:30", hook: "EXAMPLE · THE TICKING CLOCK", seconds: 58, score: 76, caption: "An example caption.",
        words: { "screens.0.film": "EXAMPLE FILM", "screens.0.type": "SCREENPLAY BREAKDOWN", "package.caption": "An example caption.\n\nSecond paragraph." } },
      { n: 3, id: "example-watch-01", series: "movie-recommendations", state: "ready", slot: "15:30", hook: "4 FILMS TO WATCH TONIGHT", seconds: 31, score: 75,
        words: { "screens.0.lines": "4 FILMS TO WATCH TONIGHT / IF YOU LOVED THE EXAMPLE", "package.caption": "An example caption." } },
      { n: 4, id: "example-update-02", series: "movie-updates", state: "held", slot: "18:00", hook: "EXAMPLE · BOX OFFICE", why: "Inspection: a picture stayed still too long" } ] },
    tomorrow: { date: "the day after", slots: [{ time: "08:30", series: "movie-updates" }, { time: "12:30", series: "film-breakdown" }, { time: "15:30", series: "guess-the-movie" }] },
    bank: { ready: 2 }, schedule: [{ at: at(0.4), what: "Post · 12:30 slot", kind: "post" }, { at: at(3.4), what: "Post · 15:30 slot", kind: "post" }, { at: at(4.6), what: "Thinking run · Refresh", kind: "think" }, { at: at(5.3), what: "Make reels", kind: "make" }],
    numbers: { followers: 120, goal: 1000, target_today: 140, days_left: 80, recent: [{ id: "example-update-00", views: 1840, rates: { skip_rate: .41, watch_through: .22, share_rate: .012 }, health: { skip_rate: "green", share_rate: "amber" } }] },
    series: [{ id: "movie-updates", name: "Movie Updates", status: "live", slots: ["08:30", "18:00", "21:30"], median_views: 1500, page_views: 1300, rules: [] },
             { id: "movie-recommendations", name: "Watch This Next", status: "trial", slots: ["15:30"], rules: [{ id: "eg1", text: "Open with a promise and a number.", at: "example" }] }],
    money: { images_inr: 26, images_cap: 500, runner_min: 370, runner_limit: 2000, storage_gb: 3.1, storage_cap: 8, posted_month: 12, per_reel: { images_inr: 2.2, runner_min: 30 } },
    alerts: [], actions: [], page_rules: [], digest: "" };
}

let P = sample(), mcp = null, live = false, problem = "", openDrawer = null;
let asked = store("asked", []);          // what this browser sent and the Engine has not picked up yet
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function store(k, d) { try { const v = localStorage.getItem("icr." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem("icr." + k, JSON.stringify(v)); } catch (e) {} }
const hm = iso => new Date(iso).toLocaleTimeString("en-IN", { ...IST, hour: "2-digit", minute: "2-digit", hour12: false });
const dayName = iso => new Date(iso).toLocaleDateString("en-IN", { ...IST, weekday: "short" });
const pct = v => v == null ? "—" : (v * 100).toFixed(1) + "%";
const num = v => v == null ? "—" : Number(v).toLocaleString("en-IN");
function span(ms) { if (ms < 0) ms = 0; const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h} h ${String(m).padStart(2, "0")} m` : `${m} m`; }
function clock(ms) { if (ms < 0) ms = 0; const s = Math.floor(ms / 1000); return [Math.floor(s / 3600), Math.floor(s % 3600 / 60), s % 60].map(x => String(x).padStart(2, "0")).join(":"); }
function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 5200); }

/* ---------- reading the panel from Drive (no Claude tokens) ---------- */
function unpack(result) {
  let p = result && result.payload;
  if (typeof p === "string") { try { p = JSON.parse(p); } catch (e) { p = { fileContent: p }; } }
  let t = p && (p.fileContent || p.content || p.text);
  if (!t && result && result.content) t = result.content.map(c => c.text || "").join("\n");
  if (typeof t === "string" && t.trim().startsWith("{") && t.includes("fileContent")) { try { t = JSON.parse(t).fileContent; } catch (e) {} }
  const i = String(t || "").indexOf("INIKKI-PANEL-1");
  if (i < 0) throw new Error("The status file is not in the expected form yet.");
  const b = String(t).slice(i + 14).replace(/[^A-Za-z0-9+/=]/g, "");
  if (!b) throw new Error("The Engine has not written the status file yet. It does so after its next job.");
  return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b), c => c.charCodeAt(0))));
}
function onData(result) {
  try { P = unpack(result); live = true; problem = ""; } catch (e) { problem = e.message; }
  asked = asked.filter(a => a.at > Date.parse(P.updated_iso || 0) - 60000 && Date.now() - a.at < 36 * 3600e3); save("asked", asked);
  render();
}
function onError(err) {
  const c = err && err.code;
  problem = c === "needs_reauth" || c === "server_not_connected" ? "Google Drive is not connected. In Claude: Settings → Connectors → Google Drive, then press Refresh."
    : c === "not_granted" ? "This page needs your permission to read Google Drive. Press Refresh and choose Allow."
    : "The status file could not be read just now (" + ((err && err.message) || "unknown reason") + "). Press Refresh to try again.";
  render();
}
function refresh() {
  if (!mcp) return toast("Showing example data. Open this page in Claude with Google Drive connected.");
  $("#updated").textContent = "Reading…";
  mcp.callTool(CFG.server, "read_file_content", { fileId: CFG.panel }, { cache: { refresh: true } }).then(onData, onError);
}
let watching = false;
function poll() { if (poll.on) return; poll.on = true; refresh(); setInterval(() => { if (!document.hidden) refresh(); }, 180000); }
function connect() {
  const c = window.claude;
  if (!c || !c.use) { problem = "Showing example data. Open this page in Claude to see your own."; return render(); }
  c.use("mcp").then(m => {
    if (!m) { problem = "Showing example data. Live data needs this page opened in Claude with Google Drive connected."; return render(); }
    mcp = m;
    try { mcp.watchTool(CFG.server, "read_file_content", { fileId: CFG.panel }, ev => {
        if (ev.type === "data") { watching = true; return onData(ev.result); }
        if (!watching && !live) return poll();           // this viewer cannot keep a watch: read it ourselves instead
        onError(ev.error); }, { refetchInterval: 180000 }); }
    catch (e) { poll(); }
  });
}

/* ---------- sending one small note to the inbox ---------- */
function pickup() { const s = (P.schedule || []).find(x => x.kind !== "think" && Date.parse(x.at) > Date.now()); return s ? `${hm(s.at)} (in ${span(Date.parse(s.at) - Date.now())})` : "its next job"; }
function send(action, label, key) {
  if (!mcp) { toast("Example mode: nothing was sent. Open this page in Claude with Google Drive connected."); return Promise.resolve(false); }
  const d = new Date(), ts = d.toISOString().replace(/[-:T]/g, "").slice(0, 14);
  return mcp.callTool(CFG.server, "create_file", { title: `${ts}-${action.do}.json`, parentId: CFG.inbox, contentMimeType: "text/plain",
    disableConversionToGoogleType: true, textContent: JSON.stringify(action) }).then(() => {
      asked.push({ at: Date.now(), label, key: key || "" }); save("asked", asked);
      toast(`Sent: ${label}. The Engine picks it up at ${pickup()}.`); render(); return true;
    }, err => { toast("Not sent: " + ((err && err.message) || "Google Drive refused") + "."); return false; });
}
const askedFor = key => asked.filter(a => a.key === key).map(a => a.label);

/* ---------- views ---------- */
function head() {
  $("#phase").innerHTML = P.phase ? `<span class="pill ${P.phase === "live" ? "posted" : "planned"}">${esc(P.phase)}</span>` : "";
  $("#updated").textContent = P.example ? "Example data" : "Updated " + String(P.updated).replace(/^\d{4}-\d{2}-\d{2} /, "");
  document.querySelectorAll(".switch button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === P.switch)));
  document.querySelectorAll("nav.tabs a").forEach(a => a.getAttribute("href") === "#" + tab() ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  tick();
}
function tick() {
  const s = (P.schedule || []).find(x => Date.parse(x.at) > Date.now());
  $("#nextwhat").textContent = s ? `${s.what} · ${dayName(s.at)} ${hm(s.at)}` : "No run listed";
  $("#count").textContent = s ? clock(Date.parse(s.at) - Date.now()) : "--:--:--";
}
function banners() {
  let h = "";

  if (act === "send-remake") { const hook = ($("#rm-hook").value || "").trim(); if (!hook) return toast("Type the new hook first."); return void send({ do: "remake", reel_id: id, hook }, "new version", id).then(done); }
  if (act === "send-love" || act === "send-notgood") { const reasons = [...document.querySelectorAll("#fb-chips [aria-pressed=true]")].map(x => x.textContent), text = ($("#fb-text").value || "").trim();
    if (!reasons.length && !text) return toast("Pick a reason or type a line."); return void send({ do: "feedback", reel_id: id, series: r.series, rating: act === "send-love" ? 5 : 2, reasons, text }, act === "send-love" ? "love it" : "not good", id).then(done); }
  if (act === "idea") { const el = $("#idea"), text = (el.value || "").trim(); if (!text) return toast("Type the idea first."); return void send({ do: "idea", text }, "idea").then(ok => { const x = $("#idea"); if (ok && x) x.value = ""; }); }
  if (act === "ack") return void send({ do: "ack", alert: "all" }, "alerts read");
  if (act === "rule") { const el = document.getElementById(b.dataset.input || "rule-all"), text = (el.value || "").trim(); if (!text) return toast("Type the rule first."); return void send({ do: "note", series: id, text }, "new rule", id === "all" ? "" : id).then(ok => { const x = document.getElementById(b.dataset.input || "rule-all"); if (ok && x) x.value = ""; }); }
  if (act === "pause" || act === "resume") return void send({ do: "series", id, set: { paused: act === "pause" } }, act, id);
  if (act === "undo") return void send({ do: "undo", id }, "undo");
  if (act === "vol") { const n = ((P.volume || {}).base || 6) + Number(id); return void send({ do: "set", settings: { volume: { base: n } } }, n + " reels a day"); }
  if (act === "phase") { scrollTo(0, 0); openDrawer = { id: "setup", kind: "confirm", text: id === "live" ? "Go live? Reels will post to Instagram at their slots." : "Back to rehearsal? Reels are still made, nothing posts.", yes: id === "live" ? "Yes, go live" : "Yes, rehearsal", action: { do: "set", settings: { phase: id } }, label: id }; return render(); }
});
addEventListener("hashchange", () => { openDrawer = null; render(); scrollTo(0, 0); });
setInterval(tick, 1000);
render(); connect();
</script>
