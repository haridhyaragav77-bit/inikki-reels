# Follows the standard for every reel (AGENT.md 5.10): worth-it test, title screen, music from frame 1,
# lots of animation, this series' own look.
id: artwork-quote
name: Frame & Line (Artwork + Quote)
status: live
badge: { text: "FRAME & LINE", color: soft_gold }
title_screen: "{FILM} · THE LINE"
per_day: 0              # flex: switches on after a dull stretch of 2-3 days
trigger: dull_streak
slots: ["17:00"]
hook: spotlight               # visual hook for the first second (rules/motion.md); a plan may pick one that fits the film
template: cinematic
visuals: ai_images
voice: false
length_s: [12, 20]
image_cap_per_reel: 1
lead_sources: [iconic_dialogues, occasions, trends]
story_shape: [image_reveal, the_line_tamil, the_line_translation, relate_question]
meme_use: never
success_metric: saves_and_sends
music: soft_warm          # starts on frame 1
motion_presets: [brush_reveal, quote_reveal, parallax_layers, light_sweep]
worth_it_extra:
  - "Is the line famous enough to be recognised in 2 seconds?"
