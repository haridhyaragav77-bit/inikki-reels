# Follows the standard for every reel (AGENT.md 5.10): worth-it test, title screen, music from frame 1,
# lots of animation, this series' own look.
id: breaking-news
name: Breaking
status: live
badge: { text: "BREAKING", color: red }
title_screen: "BREAKING · {FILM OR PERSON}: {WHAT}"
per_day_max: 2
trigger: watcher_or_brain_run
template: flash         # its own look: red wash, live dot, headline slam, ticker (AGENT.md 6.6)
visuals: mixed
voice: false
length_s: [15, 25]
image_cap_per_reel: 0
proof_required: 2
story_shape: [title_screen, headline_slam, fact_1, fact_2, what_next, follow_prompt]
meme_use: never
success_metric: reach
rules:
  - "Only real, confirmed, time-sensitive news."
  - "Respect mode overrides: deaths and tragedies are handled as tributes, never as 'breaking'."
  - "Always scout the official poster and stills first: release-date news nearly always comes with them. The poster leads."
  - "No visuals at all: lead with the biggest name (director, music director or star) and their picture, e.g. NEW MANI RATNAM FILM."
captions: none
music: stinger            # hits on frame 1 with the headline
motion_presets: [live_dot, headline_slam, fact_blocks, ticker, glitch_cut, still_reframe]
worth_it_extra:
  - "Is it confirmed by 2 trusted sources?"
  - "Would a fan want to know this today, not tomorrow?"
reference:   # approved 13 Nov 2026; replaces the earlier reference reels
  plan: plans/reference/breaking-inji-vellam-date.json
  reel: "Drive reference-reels/2026-11-13/2026-11-13 · BREAKING · INJI VELLAM: RELEASE DATE.mp4"
expires_h: 24           # news older than this is not posted (AGENT.md 12.1)
