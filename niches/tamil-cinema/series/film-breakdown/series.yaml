# Follows the standard for every reel (AGENT.md 5.10): worth-it test, title screen, music from frame 1,
# lots of animation, this series' own look.
id: film-breakdown
name: Film Breakdown
status: live
priority: 1            # the page's main product
badge: { text: "THE SCREENPLAY BREAKDOWN", alt_texts: ["THE CINEMATOGRAPHY BREAKDOWN", "THE CAMERA BREAKDOWN", "THE SET DESIGN BREAKDOWN", "THE EDITING BREAKDOWN", "THE SOUND BREAKDOWN", "THE PERFORMANCE BREAKDOWN"], color: gold }
title_screen: "{FILM} · {ANGLE} BREAKDOWN"     # e.g. "VIKRAM VEDHA · SCREENPLAY BREAKDOWN"; film's title logo from the trailer when available
per_day: 2
slots: ["12:30", "20:00"]
template: stage         # its own look: dark stage, motion graphics lead (AGENT.md 6.6)
visuals: motion_graphics_first   # clips where they truly show the point; graphics carry the rest
voice: true
captions: tamil_tanglish_subtitles   # two lines synced to the voice, spoken word lit (change #7)
instagram_safe: { right_px: 160, bottom_px: 420, subtitle_band: [1335, 1500] }   # words and key visuals stay clear of Instagram's buttons
length_s: [40, 62]      # about 1 minute is the safe spot (change #8); shorter is fine
length_max_s: 75        # only when truly needed; the plan writes down why
image_cap_per_reel: 0
bank_target: 4          # keep 3-4 finished breakdowns ready
angles: [screenplay, cinematography_camera, set_production_design, editing, sound_music, performance]
lead_sources: [cult_classics, new_releases, news_hooks, anniversaries, re_releases, film_bank, comments]
story_shape: [title_screen_sound_on, hook, setup, the_technique_named, where_it_comes_from, how_the_film_uses_it, why_it_works, payoff, end_recap_technique]
hook_style: "A short Tanglish question about something the viewer felt but never noticed."
hook_examples:
  - "Phone-a thoda vidala. Yen?"
  - "Yaaru yaarai iyakkuraanga?"
  - "Saadhaarana satham. Bayam yen?"
music_arc: [intrigue, tension, release]   # music changes with the story; starts on frame 1
motion_library: "../../motion_library.md"
motion_presets: [tension_bar, timer_dial, timeline_scrub, setup_payoff_thread, power_scale, character_map, knowledge_gap, camera_path, shot_scale_ladder, light_map, cut_rhythm, sound_layers, fight_map, split_compare]
meme_use: ending_only
trend_hooks: true
success_metric: sends_per_reach
rules:
  - "Value is the hero: the reel must pass the worth-it test (AGENT.md 5.7) before any visual is chosen."
  - "Pin a named technique (frame story, ticking clock, match cut, leitmotif...): name it on screen, define it, show it, say why it works, recap it at the end."
  - "Write the script first, then plan the motion graphics, then look for clips. Never bend the script to fit footage."
  - "Pick the strongest angle for the film: screenplay, camera, set, editing, sound or acting."
  - "Pick films people care about now: cult classics, new releases, films in the news. Skip old films with no cult following."
  - "Screen 1 names the film and the angle, big and clear."
  - "One idea per reel, told in 2-4 beats."
  - "Motion graphics show the idea on the word it is said: labels of 3 words or fewer, no graphic repeated in a reel, one hero moment."
  - "If no clip fits a beat, the motion graphic goes full-screen for that beat."
  - "Never retell the plot; explain why a scene works."
  - "Same film at most once in 21 days; same film + angle at most once in 60 days."
worth_it_extra:
  - "Is this the strongest angle on this film?"
reference:   # approved 13 Nov 2026; replaces the earlier reference reels
  plan: plans/reference/breakdown-vikram-vedha.json
  reel: "Drive reference-reels/2026-11-13/2026-11-13 · VIKRAM VEDHA · SCREENPLAY BREAKDOWN.mp4"
