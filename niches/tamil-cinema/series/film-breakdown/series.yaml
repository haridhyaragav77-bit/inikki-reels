# Follows the standard for every reel (AGENT.md 5.10): worth-it test, title screen, music from frame 1,
# lots of animation, this series' own look.
id: film-breakdown
name: Film Breakdown
promise: "The detail you missed in a film you love, and why it works." # Harish, 19 Nov: detail first, technique as the why
status: live
priority: 1            # the page's main product
badge: { text: "THE SCREENPLAY BREAKDOWN", alt_texts: ["THE CINEMATOGRAPHY BREAKDOWN", "THE CAMERA BREAKDOWN", "THE SET DESIGN BREAKDOWN", "THE EDITING BREAKDOWN", "THE SOUND BREAKDOWN", "THE PERFORMANCE BREAKDOWN", "HIDDEN DETAILS", "BEHIND THE SCENES"], color: gold }
title_screen: "{FILM} · {ANGLE} BREAKDOWN"     # e.g. "VIKRAM VEDHA · SCREENPLAY BREAKDOWN"; film's title logo from the trailer when available
per_day: 2
slots: ["12:30", "20:00"]
template: stage         # its own look: dark stage, motion graphics lead (AGENT.md 6.6)
visuals: motion_graphics_first   # clips where they truly show the point; graphics carry the rest
voice: true
voice_cfg: { speed: 1.2 }   # Harish, 19 Nov: quicker (1.2 is ElevenLabs' fastest); screens keep tail 0.12 s
captions: tamil_tanglish_subtitles   # two lines synced to the voice, spoken word lit (change #7)
instagram_safe: { right_px: 160, bottom_px: 420, subtitle_band: [1335, 1500] }   # words and key visuals stay clear of Instagram's buttons
length_s: [45, 90]      # Harish, 19 Nov: 60-90 s (room for the detail, the why and the payoff); shorter is fine
length_max_s: 90        # the plan writes down why in length_reason
image_cap_per_reel: 0
bank_target: 4          # keep 3-4 finished breakdowns ready
angles: [screenplay, cinematography_camera, set_production_design, editing, sound_music, performance, hidden_details, behind_the_scenes]
lead_sources: [cult_classics, new_releases, news_hooks, anniversaries, re_releases, film_bank, comments, channel_study, hollywood_in_news]
story_shape: [title_screen_sound_on, hook_the_detail, setup, the_detail_shown, the_technique_named, why_it_works, payoff, end_recap_technique]
story_shapes:            # per angle (AGENT.md 5.7)
  hidden_details: [title_screen_sound_on, hook_the_best_detail_teased, detail_1, detail_2, detail_3_the_best, what_they_add_up_to, end_recap]
  behind_the_scenes: [title_screen_sound_on, hook_the_surprise, who_told_it_and_where, the_story, the_trick_named, why_it_mattered_on_screen, end_recap]
hook_style: "A short Tanglish line that points at one specific detail or true story the viewer never noticed (from the channel study, AGENT.md 10.3)."
hook_examples:
  - "Phone-a thoda vidala. Yen?"
  - "Yaaru yaarai iyakkuraanga?"
  - "Saadhaarana satham. Bayam yen?"
  - "Jail scene-la oru detail. 100 per-la 99 per miss pannirupaanga."
  - "Indha song last minute-la maathunaanga. Yen theriyuma?"
# THE SPINE (Harish, 19 Nov): every breakdown is told in this order; each screen names its beat ("beat": ...) and the plan
# check refuses a reel that breaks it. A beat may take more than one screen (body 3 often = the detail + the technique).
spine: [hook, lead, body, loop, body, loop, body, cta]
beats:
  hook: "Title screen, 0-3 s, 6 to 10 words: one specific, surprising claim about something on screen ('the car he drove was not an F1 car'). Never the film's name alone, never a lesson, never 'did you know'."
  lead: "3-8 s: who/what in one line, then the promise of the payoff ('3 secrets; the third one is dark')."
  body: "One detail, 8-15 s, in its own illustration; ends on a punch line. Body 3 is the strongest: it pays the hook, names the technique and says why it works."
  loop: "1-3 s open loop on its own screen (a standoff tease): a gap only the next body closes ('but the real secret is inside the car'). Never a summary."
  cta: "End screen: one question that is easy to answer in a comment (pick a side, name a film), then who to send it to."
bend:   # how a source's short becomes ours (AGENT.md 5.7)
  - "Keep their strongest detail; cut their order. Strongest detail last."
  - "Add one layer they don't have: the technique's name, a second verified fact, a contrast with another film (Tamil and Hollywood), or the consequence."
  - "Say it in fewer words: 8 to 18 words a screen; one idea a screen."
  - "Check every fact in 2 sources (Wikipedia production section, an interview, IMDb trivia); credit the original interview, never their video."
music_arc: [intrigue, tension, release]   # music changes with the story; starts on frame 1
motion_library: "../../motion_library.md"
motion_presets: [detail_zoom, butterfly_chain, insider_quote, source_vs_film, part_badge, tension_bar, timer_dial, timeline_scrub, setup_payoff_thread, power_scale, character_map, knowledge_gap, camera_path, shot_scale_ladder, light_map, cut_rhythm, sound_layers, fight_map, split_compare]
meme_use: ending_only
trend_hooks: true
success_metric: sends_per_reach
rules:
  - "Value is the hero: the reel must pass the worth-it test (AGENT.md 5.7) before any visual is chosen."
  - "Pin a named technique (frame story, ticking clock, match cut, leitmotif...): name it on screen, define it, show it, say why it works, recap it at the end."
  - "Write the script first, then plan the motion graphics, then look for clips. Never bend the script to fit footage."
  - "Pick the strongest angle for the film: screenplay, camera, set, editing, sound or acting."
  - "Pick films people care about now: cult classics, new releases, films in the news. Skip old films with no cult following."
  - "Screen 1 names the film and the angle, big and clear."
  - "One idea per reel, told in 2-4 beats."
  - "Motion graphics show the idea on the word it is said: labels of 3 words or fewer, no graphic repeated in a reel, one hero moment."
  - "If no clip fits a beat, the motion graphic goes full-screen for that beat."
  - "Never retell the plot; explain why a scene works."
  - "Lead with the detail: the hook names one specific thing on screen or one true story, never a lesson (Harish, 19 Nov)."
  - "Behind the scenes: name who said it and where (interview, year) on a quote screen; 2 trusted sources in the plan; never use another channel's video or wording."
  - "Hidden details: exactly 3, each on its own frame with the detail lens, counted 1/3, 2/3, 3/3, best one last."
  - "Film week: up to 3 parts on one film in 7 days (part: [n, 3] in the plan); each part a different angle or detail set and complete on its own; the end card names the next part."
  - "Outside a film week: same film at most once in 21 days; same film + angle at most once in 60 days."
  - "Hollywood and world films the audience knows are welcome (a new release, a re-release, a film in the news)."
  - "Topics and insight come first from the studied sources, in priority order (niche competitors: Expert FX, then Level Up Learning Filmmaking, then World Filmology). Cover everything their short covers, richer, in our own words and order, checked in 2 sources."
  - "Fight the drop-off (Harish, 19 Nov): an open question in the first 3 s that is only answered near the end; a new hook every 10-15 s (a twist, 'but that is not the real detail', a secret, a number); never a beat that only repeats. Length is what the value needs, up to 90 s; never cut value to hit 30 s."
  - "Every graphic is drawn for this film's idea (a staircase for a staircase, an evidence board for linked crimes, a race track for a race): pick or build the illustration that shows the thing itself. A kind appears at most twice in a reel (once, plus one callback)."
worth_it_extra:
  - "Is this the strongest angle on this film?"
reference:   # approved 13 Nov 2026; replaces the earlier reference reels
  plan: plans/reference/breakdown-vikram-vedha.json
  reel: "Drive reference-reels/2026-11-13/2026-11-13 · VIKRAM VEDHA · SCREENPLAY BREAKDOWN.mp4"
# Harish, 14 Nov 2026: every breakdown gets its own design. A plan names a design kit and builds its middle from the
# graphics that fit this film's idea; the plan check refuses a kit or a build the last reels used (AGENT.md 5.8).
unique_design: { since: "2026-11-15", window: 3, shape_window: 2, kits: [spotlight, blueprint, noir, neon, paper, forest, royal] }
graphics: [pins, technique, loop, cards, moral, standoff, timeline, meter, versus, web, detail, chain, quote, source]   # the screens a breakdown is built from
