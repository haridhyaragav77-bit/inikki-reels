id: trailer-breakdown
name: Trailer Breakdown
status: trial            # Harish, 12 Nov 2026 (AGENT.md 5.12)
badge: { text: "TRAILER BREAKDOWN", color: gold }
per_day: 1               # flex slot, only when a new trailer has landed in the library
slots: ["19:00"]
hook: flare
template: card
visuals: clips           # only that trailer's own clips
min_screens: 12
strict_length: true
voice: true
length_s: [40, 50]
image_cap_per_reel: 0
lead_sources: [new_trailers_in_library]
story_shape: [hook_on_the_biggest_shot, noticed_1, noticed_2, noticed_3, what_it_might_mean, send_to_friend]
hook_examples:
  - "Indha shot-a gavanicheengala?"
  - "Trailer-la 3 vishayam miss pannirupeenga."
proof_required: 0        # only what the trailer shows; guesses are asked as questions, never stated as facts or leaks
meme_use: ending_only
success_metric: sends_per_reach
expires_h: 72            # a trailer breakdown is worth posting within 3 days of the drop
rules:
  - "Only what is on screen in the trailer; anything more is a question, not a claim."
  - "No leaks, no rumours, no star-versus-star."
