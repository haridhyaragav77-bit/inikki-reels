# Follows the standard for every reel (AGENT.md 5.10): worth-it test, title screen, music from frame 1,
# lots of animation, this series' own look.
id: movie-updates
name: Movie Updates
status: live
badge: { text: "MOVIE UPDATE", color: teal }
title_screen: "{FILM} · {WHAT}"   # e.g. "COOLIE · WEEK 1 BOX OFFICE", "COOLIE CROSSES ₹100 CR", "JAILER 2 · RELEASE DATE"
per_day: 3
slots: ["08:30", "18:00", "21:30"]
template: bulletin      # its own look: full-bleed stills, big numbers, bold type (AGENT.md 6.6)
visuals: stills_first   # official stills and posters (official Instagram accounts first), trailer clips
voice: case_by_case     # music-only for box office, dates and first looks; voice only when something needs explaining
voice_default_by_type: { box_office: false, release_date: false, first_look: false, trailer_drop: false, cast_crew_news: true, explainer: true }
captions: none_when_music_only
length_s: [15, 30]
image_cap_per_reel: 0
lead_sources: [trusted_news, official_accounts, official_instagram, youtube_trailers, release_calendar, box_office_trackers, trends]
story_shape: [title_screen, the_number_or_news, 1_to_2_supporting_facts, whats_next, light_question]
hook_examples:
  - "Alien-aiyum kalaaippaaraa?"
  - "Old team. New chapter."
music: { default: bold_poppy_mass, box_office: loud_triumphant }   # a hook, never subtle (change #3)
motion_presets: [counter_rollup, bar_race, milestone_ladder, calendar_flip, map_pins, still_reframe, light_sweep]
proof_required: 2       # trusted sources that must agree
meme_use: ending_only
trend_hooks: true
success_metric: sends_per_reach
rules:
  - "The title screen says exactly what the update is, e.g. 'COOLIE · WEEK 1 BOX OFFICE'."
  - "No spoilers, ever: no plot, twists, cameos or endings. Report numbers, dates, cast, crew, trailers, songs, OTT dates."
  - "Before writing, answer: why would a fan open this? Report only that."
  - "Keep it simple: one big number or fact per screen, on a full-bleed still."
  - "Unconfirmed = say 'reportedly' or skip."
  - "End with a light, no-fan-war question."
worth_it_extra:
  - "Why would a fan open this?"
  - "Does this spoil anything? (If yes, cut it.)"
reference:   # approved 13 Nov 2026; replaces the earlier reference reels
  plan: plans/2026-11-13/update-scene-week1.json
  reel: "Drive reference-reels/2026-11-13/2026-11-13 · SCENE · WEEK 1 BOX OFFICE.mp4"
