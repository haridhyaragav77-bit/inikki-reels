# Reviewers people trust (Harish, 22 Nov; AGENT.md 10.5). Read by the plan check and the brief. Harish owns this list:
# the thinking runs cannot change it. To add or drop a reviewer, edit this file (Workshop) or ask the Control Room chat.
# A Trusted Review uses only these reviewers, at least `min_trusted` of them. `match` lists other spellings a plan may use.
trusted:     # Harish, 25 Nov: these three only, all three needed
  - { name: "Baradwaj Rangan", outlet: "Galatta Plus", rates: verbal, match: ["baradwaj rangan", "bharadwaj rangan", "galatta plus"] }
  - { name: "Prashanth Rangaswamy", outlet: "YouTube", rates: verbal, match: ["prashanth rangaswamy", "prashanth"] }
  - { name: "Sudhir Srinivasan", outlet: "YouTube (long review)", rates: verbal, match: ["sudhir srinivasan", "sudhir"] }
# The Quick Review on release day: the earliest credible reviews (any named critic or outlet counts; these come first)
early:
  - { name: "The Hindu", outlet: "The Hindu", rates: verbal }
  - { name: "Cinema Express", outlet: "The New Indian Express", rates: stars }
  - { name: "The Times of India", outlet: "The Times of India", rates: stars }
# Films whose reviews are skipped: no review reel, no "missed" alert (Harish, 25 Nov: these two are too late now)
skip_reviews: ["O.M: Operation Mole", "Sathyavan Savithiri"]
min_trusted: 3          # a Trusted Review waits until all three have reviewed
min_quick: 2            # a Quick Review needs at least this many early reviews (any named critic or outlet)
window_days: [1, 4]     # the Trusted Review goes out 1 to 4 days after release, as soon as min_trusted are in
# A review without stars is read as one of these words, each worth a fixed score out of 5 (code, not a guess)
verbal_scale: { rave: 4.5, positive: 4.0, mostly_positive: 3.5, mixed: 3.0, mostly_negative: 2.5, negative: 2.0, pan: 1.5 }
# The answer to "should I go?", from the combined score (the first line whose min the score reaches)
verdicts:
  - { min: 3.5, word: "GO", line: "WATCH IT IN THEATRES" }
  - { min: 2.5, word: "WAIT", line: "WAIT FOR OTT" }
  - { min: 0, word: "SKIP", line: "SKIP IT" }
